name: verify
on: [push, pull_request]
jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy matplotlib
      - name: engine self-tests
        run: python3 xnomos.py
      - name: verification battery
        run: python3 verify.py
      - name: demo engine differential test
        run: |
          python3 demo/gen_vectors.py > /tmp/xn_vectors.json
          node demo/xengine.test.js
      - name: demo inlined engine is verbatim
        run: python3 check_inline.py
      - name: demo runs headless without hanging
        run: node demo/headless_test.js 3000
